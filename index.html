<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Legal information for Aura">
  <title>Aura Legal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0d;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      width: min(520px, calc(100% - 40px));
      text-align: center;
      padding: 60px 0;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 12px;
    }

    p {
      color: #9b9ba3;
      margin-bottom: 36px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 16px 20px;
      border: 1px solid #29292f;
      border-radius: 14px;
      color: #f5f5f7;
      text-decoration: none;
      background: #141416;
      font-weight: 600;
    }

    a:hover {
      background: #1c1c20;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">AURA</div>
    <h1>Legal</h1>
    <p>Legal information for the Aura app.</p>

    <div class="links">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Use</a>
    </div>
  </main>
</body>
</html>
